<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>Account | JPN</title><link rel="icon" href="/JPN/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#10182b;--text:#f3f6ff;--muted:#9caac4;--cyan:#22d3ee;--purple:#9b8cff;--border:rgba(164,190,255,.16)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,rgba(34,211,238,.12),transparent 36rem),radial-gradient(ellipse at 90% 20%,rgba(155,140,255,.13),transparent 34rem),var(--bg);color:var(--text);font:16px/1.6 "DM Sans",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--border);background:rgba(8,13,27,.88)}nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:700 1.25rem "Space Grotesk",sans-serif}.brand small{display:block;font:500 .65rem "DM Sans",sans-serif;letter-spacing:.12em;color:var(--muted)}.links{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}.links a:hover{color:var(--cyan)}main{padding:64px 0}.panel{max-width:560px;margin:0 auto;background:linear-gradient(145deg,rgba(18,30,53,.96),rgba(12,19,35,.96));border:1px solid var(--border);border-radius:24px;padding:clamp(24px,5vw,42px);box-shadow:0 24px 70px #0003}h1,h2,h3{font-family:"Space Grotesk",sans-serif;line-height:1.15;letter-spacing:-.03em}h1{font-size:clamp(2.2rem,5vw,3.2rem);margin:10px 0 12px}.muted{color:var(--muted)}.eyebrow{color:var(--cyan);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}label{display:block;font-size:.9rem;font-weight:600;margin:18px 0 7px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--border);background:#080d1b;color:var(--text);font:inherit}button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:12px 17px;background:linear-gradient(100deg,var(--cyan),#86e9ff);color:#06101b;font:700 .96rem "DM Sans",sans-serif;cursor:pointer}.wide{width:100%;margin-top:18px}.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}button:disabled{opacity:.6;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.notice{margin-top:16px;padding:12px 14px;border-radius:10px;background:#080d1b;border:1px solid var(--border);color:var(--muted);overflow-wrap:anywhere}.notice:empty{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}.card{padding:22px;border:1px solid var(--border);border-radius:18px;background:rgba(16,24,43,.78)}.card p{color:var(--muted)}footer{padding:25px 0;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem}@media(max-width:560px){nav{align-items:flex-start;padding:16px 0;flex-direction:column}.links{gap:12px}main{padding:36px 0}}
</style></head><body><header><div class="wrap"><nav><a class="brand" href="/JPN/">JPN <small>J-PRIVATE-NETWORK</small></a><div class="links"><a href="/JPN/">Home</a><a href="/JPN/pricing/">Pricing</a><span id="member-nav" hidden><a href="/JPN/dashboard/">My Account</a><a href="/JPN/downloads/">Downloads</a></span></div></nav></div></header><main><div class="wrap"><section class="panel"><div class="eyebrow">JPN Account</div><h1>Welcome to your network.</h1><p class="muted">Sign in or create an account to access your JPN dashboard.</p><form id="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"><button class="wide" id="submit" type="submit">Sign in</button></form><div class="row"><button class="secondary" id="signup" type="button">Create account</button><button class="secondary" id="reset" type="button">Reset password</button></div><div class="notice" id="message" role="status" aria-live="polite"></div><p class="muted" style="font-size:.84rem">Creating an account does not automatically purchase a subscription or unlock paid features.</p></section></div></main><footer><div class="wrap">© 2026 JPN · J-PRIVATE-NETWORK</div></footer><script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "../supabase-config.js";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const memberNav=document.querySelector("#member-nav");
const form=document.querySelector("#auth-form"), message=document.querySelector("#message"), submit=document.querySelector("#submit");
const syncMemberNav=async()=>{const {data:{session}}=await supabase.auth.getSession();memberNav.hidden=!session;};
await syncMemberNav();
supabase.auth.onAuthStateChange(()=>{syncMemberNav();});
const say=(text)=>message.textContent=text;
const values=()=>({email:document.querySelector("#email").value.trim(),password:document.querySelector("#password").value});
const goDashboard=()=>location.href="/JPN/dashboard/";
const {data:{session}}=await supabase.auth.getSession(); if(session) goDashboard();
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;say("Signing in…");const {email,password}=values();try{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;if(data.session)goDashboard();}catch(err){say(err.message||"Unable to sign in.")}finally{submit.disabled=false}});
document.querySelector("#signup").addEventListener("click",async()=>{const {email,password}=values();if(!email||password.length<8){say("Enter a valid email and a password of at least 8 characters first.");return}const b=document.querySelector("#signup");b.disabled=true;say("Creating your account…");try{const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:"https://jigar1234nob.github.io/JPN/dashboard/"}});if(error)throw error;if(data.session)goDashboard();else say("Account created. Check your email to confirm your address, then sign in.");}catch(err){say(err.message||"Unable to create account.")}finally{b.disabled=false}});
document.querySelector("#reset").addEventListener("click",async()=>{const email=document.querySelector("#email").value.trim();if(!email){say("Enter your email address first.");return}try{const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:"https://jigar1234nob.github.io/JPN/login/"});if(error)throw error;say("If an account exists for that address, a password reset email will be sent.")}catch(err){say(err.message||"Unable to request a reset.")}});
</script></body></html>
